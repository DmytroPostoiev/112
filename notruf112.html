let sel='kidney',L='ru',STORE='notruf112.v2';
const $=id=>document.getElementById(id),T=()=>UI[L];
const FIELDS=['address','floor','phone','caller','pname','sex','age','since','birth','meds'];
function pers(){const s=$('sex').value,n=$('pname').value.trim();
 const de=s==='f'?'Die Patientin':s==='m'?'Der Patient':'Die Person',ru=s==='f'?'Пациентка':s==='m'?'Пациент':'Человек';
 return{de:n?de+' '+n:de,ru:n?ru+' '+n:ru,t:$('since').value.trim()||'…'};}
function fill(txt,isRu){const p=pers();return txt.replace(/\{P\}/g,p.de).replace(/\{R\}/g,p.ru).replace(/\{t\}/g,p.t);}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function applyUI(){
 const t=T();document.documentElement.lang=L;
 document.querySelectorAll('[data-i]').forEach(el=>{const v=t[el.dataset.i];if(v===undefined)return;el.hasAttribute('data-html')?el.innerHTML=v:el.textContent=v;});
 $('lde').classList.toggle('on',L==='de');$('lru').classList.toggle('on',L==='ru');
 $('chk').innerHTML=t.chk.map(x=>`<label><input type="checkbox"><span>${x}</span></label>`).join('');
 render();
}
function renderSym(){
 $('sym').innerHTML=D.map(d=>`<button type="button" class="s${d.u?' urg':''}" data-id="${d.id}" aria-pressed="${d.id===sel}"><span class="e">${d.e}</span><b>${L==='ru'?d.ru:d.de}</b><small>${L==='ru'?d.de:d.ru}</small></button>`).join('');
 $('sym').querySelectorAll('.s').forEach(b=>b.onclick=()=>{sel=b.dataset.id;render();});
}
function renderDetail(){
 const d=D.find(x=>x.id===sel),t=T();
 $('detail').innerHTML=`<div class="dh"><span class="big">${d.e}</span><div><h3>${L==='ru'?d.ru:d.de}</h3><p>${L==='ru'?d.dr:d.dd}</p></div>${d.u?`<span class="tag">${t.urgent}</span>`:''}</div>
 <div class="db"><h4>${t.hdrSay}</h4><ul>${(L==='ru'?d.sr:d.sd).map(s=>`<li>${s}</li>`).join('')}</ul>
 <h4>${t.hdrPhr}</h4>${d.p.map(p=>`<div class="ph"><div class="de">${esc(fill(p[0]))}</div><div class="ru">${esc(fill(p[1]))}</div></div>`).join('')}</div>`;
}
function script(){
 const d=D.find(x=>x.id===sel),p=pers(),addr=$('address').value.trim(),fl=$('floor').value.trim(),c=$('caller').value.trim(),oth=$('other').value.trim();
 const what=d.p.slice(0,2);
 const de=[];const ru=[];
 de.push(UI.de.hi+(c?`mein Name ist ${c}. `:'')+UI.de.n+' '+UI.de.need);
 ru.push(UI.ru.hi+(c?`меня зовут ${c}. `:'')+UI.ru.n+' '+UI.ru.need);
 de.push(addr?`Die Adresse ist ${addr}${fl?', '+fl:''}.`:'Die Adresse nenne ich gleich.');
 ru.push(addr?`Адрес: ${addr}${fl?', этаж '+fl:''}.`:'Сейчас назову адрес.');
 what.forEach(w=>{de.push(fill(w[0]));ru.push(fill(w[1]));});
 const a=$('age').value.trim(),b=$('birth').value.trim(),m=$('meds').value.trim(),ph=$('phone').value.trim();
 if(a||b){de.push(`Alter: ${a||'?'}${b?', geboren '+b:''}.`);ru.push(`Возраст: ${a||'?'}${b?', дата рождения '+b:''}.`);}
 if(m){de.push('Medikamente/Allergien: '+m+'.');ru.push('Лекарства/аллергии: '+m+'.');}
 if(oth){de.push('Weitere Symptome: '+oth+'.');ru.push('Другие симптомы: '+oth+'.');}
 if(ph){de.push('Rückrufnummer: '+ph+'.');ru.push('Номер для связи: '+ph+'.');}
 de.push(UI.de.lowDe);ru.push(UI.ru.lowDe+' ('+UI.de.lowDe+')');
 return{de:de.join(' '),ru:ru.join(' '),what:what.map(w=>fill(w[0])).join(' '),whatRu:what.map(w=>fill(w[1])).join(' ')};
}
function renderScript(){const s=script();$('sDe').textContent=s.de;$('sRu').textContent=s.ru;renderQ(s);}
function renderQ(s){
 const addr=$('address').value.trim()||(L==='ru'?'…':'…');
 $('qs').innerHTML=UI.de.Q.map((q,i)=>{const r=UI.ru.Q[i];
  const a=q[1].replace('{addr}',addr).replace('{what}',s.what),ar=r[1].replace('{addr}',addr).replace('{what}',s.whatRu);
  return`<div class="q"><div class="de">${esc(q[0])}</div><div class="ru">${esc(r[0])}</div><div style="margin-top:6px;font-size:14px">→ ${esc(a)}<div class="ru">${esc(ar)}</div></div></div>`;}).join('');
}
function render(){renderSym();renderDetail();renderScript();}
function toast(s){const e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200);}
function save(){try{if($('remember').checked){const o={};FIELDS.forEach(f=>o[f]=$(f).value);o.L=L;localStorage.setItem(STORE,JSON.stringify(o));}else localStorage.removeItem(STORE);}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem(STORE)||'null');if(o){FIELDS.forEach(f=>{if(o[f]!==undefined)$(f).value=o[f]});$('remember').checked=true;}
 const l=o&&o.L||localStorage.getItem(STORE+'.lang');if(l==='de'||l==='ru')L=l;}catch(e){}}
function fullText(){const s=script();return s.de+'\n\n'+s.ru;}
$('lde').onclick=()=>{L='de';try{localStorage.setItem(STORE+'.lang','de')}catch(e){}applyUI();save();};
$('lru').onclick=()=>{L='ru';try{localStorage.setItem(STORE+'.lang','ru')}catch(e){}applyUI();save();};
[...FIELDS,'other'].forEach(f=>$(f).addEventListener('input',()=>{render();save();}));
$('sex').addEventListener('change',()=>{render();save();});
$('remember').addEventListener('change',save);
$('copy').onclick=async()=>{const text=fullText();try{await navigator.clipboard.writeText(text);}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove();}toast(T().copied);};
$('share').onclick=async()=>{const text=fullText();if(navigator.share){try{await navigator.share({text});toast(T().shared);}catch(e){}}else{try{await navigator.clipboard.writeText(text);}catch(e){}toast(T().noShare);}};
$('print').onclick=()=>window.print();
$('clear').onclick=()=>{FIELDS.forEach(f=>{$(f).value=f==='sex'?'n':''});$('other').value='';$('remember').checked=false;try{localStorage.removeItem(STORE)}catch(e){}render();toast(T().cleared);};
$('gps').onclick=()=>{if(!navigator.geolocation){toast(T().gpsFail);return;}toast(T().gpsWait);
 navigator.geolocation.getCurrentPosition(p=>{const c=p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5);const a=$('address');a.value=(a.value.trim()?a.value.trim()+' · ':'')+'GPS '+c;render();save();toast(T().gpsOk);},()=>toast(T().gpsFail),{enableHighAccuracy:true,timeout:10000,maximumAge:30000});};
load();applyUI();
</script>
